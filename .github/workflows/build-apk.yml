
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP"
          mkdir -p source
          unzip -oq "$ZIP" -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-7.6.4/bin" >> "$GITHUB_PATH"

      - name: Set SDK and build APK
        shell: bash
        run: |
          set -e
          cd source/AI_Ready_Injector_Project/android
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          sed -i -E 's/(minSdk|minSdkVersion)([[:space:]]*=?[[:space:]]*)[0-9]+/\124/g' app/build.gradle
          sed -i -E 's/(android:minSdkVersion=")[0-9]+/\124/g' app/src/main/AndroidManifest.xml
          grep -nE 'minSdk|minSdkVersion' app/build.gradle app/src/main/AndroidManifest.xml || true
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Ready-Injector-debug-APK
          path: source/AI_Ready_Injector_Project/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
