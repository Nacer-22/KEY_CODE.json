name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found in repository root"
            exit 1
          fi
          mkdir -p source
          unzip -oq "$ZIP" -d source

      - name: Find project and build APK
        shell: bash
        run: |
          set -e
          WRAPPER="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "No gradlew inside ZIP. Checking project files:"
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi
          ROOT="$(dirname "$WRAPPER")"
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Ready-Injector-debug-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
