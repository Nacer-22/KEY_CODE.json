
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP"
          mkdir -p source
          unzip -oq "$ZIP" -d source

      - name: Inspect project
        run: |
          echo "=== Android files ==="
          find source/AI_Ready_Injector_Project/android/app/src/main -maxdepth 5 -type f | sort | head -100
          echo "=== Flutter files ==="
          find source/AI_Ready_Injector_Project -type f -name '*.dart' | head -100
          echo "=== Project configuration ==="
          cat source/AI_Ready_Injector_Project/pubspec.yaml
