
      - name: Inspect project files
        working-directory: source/AI_Ready_Injector_Project
        shell: bash
        run: |
          echo "=== Project files ==="
          find . -maxdepth 5 -type f \
            ! -path './.git/*' \
            ! -path './.dart_tool/*' \
            | sort | head -200

          echo "=== Dart entry points ==="
          find . -type f -name '*.dart' \
            ! -path './.dart_tool/*' \
            | head -100

          echo "=== pubspec.yaml ==="
          cat pubspec.yaml
