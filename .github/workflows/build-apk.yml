
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP"
          mkdir -p source
          unzip -oq "$ZIP" -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-7.6.4/bin" >> "$GITHUB_PATH"

      - name: Fix SDK and build APK
        shell: bash
        run: |
          set -e
          cd source/AI_Ready_Injector_Project/android
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          files = list(root.rglob("*.gradle")) + list(root.rglob("*.gradle.kts"))
          changed = False

          for p in files:
              s = p.read_text()
              new = re.sub(
                  r'(\bminSdk(?:Version)?\s*=?\s*)21\b',
                  r'\g<1>23',
                  s
              )
              if new != s:
                  p.write_text(new)
                  print("Updated:", p)
                  changed = True

          for p in root.rglob("AndroidManifest.xml"):
              s = p.read_text()
              new = re.sub(r'(android:minSdkVersion\s*=\s*")21(")', r'\g<1>23\2', s)
              if new != s:
                  p.write_text(new)
                  print("Updated:", p)
                  changed = True

          print("SDK setting scan:")
          for p in files:
              for line in p.read_text().splitlines():
                  if "minSdk" in line:
                      print(f"{p}: {line.strip()}")
          PY
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Ready-Injector-debug-APK
          path: source/AI_Ready_Injector_Project/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
