
name: Inspect Android Project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi
          mkdir -p source
          unzip -oq "$ZIP" -d source

      - name: Inspect Dart and Android files
        shell: bash
        run: |
          echo "=== Dart files ==="
          find source -type f -name '*.dart' \
            ! -path '*/.dart_tool/*' | head -100

          echo "=== Flutter configuration ==="
          find source -type f -name pubspec.yaml

          echo "=== Android source files ==="
          find source/AI_Ready_Injector_Project/android/app/src/main \
            -maxdepth 5 -type f | head -100
